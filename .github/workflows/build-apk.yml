name: Build Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug)'
        required: false
        default: 'debug'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare Environment & Secrets
        run: |
          echo "[*] Preparing environment files..."
          # Ensure .env exists for Secrets Gradle Plugin
          touch .env
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Restore or Generate Debug Keystore
        run: |
          echo "[*] Configuring debug signing keystore..."
          if [ -f debug.keystore.base64 ]; then
            echo "[+] Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "[+] Generating fresh debug.keystore..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "[!] gradlew not found in root, bootstrapping wrapper..."
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: |
          echo "[*] Building Debug APK with Gradle..."
          ./gradlew assembleDebug --stacktrace

      - name: Locate and Package Output APK
        id: find_apk
        run: |
          echo "[*] Locating generated APK files..."
          ORIGINAL_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$ORIGINAL_APK" ]; then
            echo "::error::No APK file generated in app/build/outputs/apk/debug"
            exit 1
          fi

          echo "Found generated APK: $ORIGINAL_APK"
          OUTPUT_DIR="build-output"
          mkdir -p "$OUTPUT_DIR"
          
          # Friendly output name
          APK_NAME="DriverLoader-debug.apk"
          cp "$ORIGINAL_APK" "$OUTPUT_DIR/$APK_NAME"
          
          APK_PATH="$OUTPUT_DIR/$APK_NAME"
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          APK_SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)

          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "apk_sha256=$APK_SHA256" >> $GITHUB_OUTPUT

          echo "=== APK Built Successfully ==="
          echo "Path: $APK_PATH"
          echo "Size: $APK_SIZE"
          echo "SHA256: $APK_SHA256"

      - name: Generate Job Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🚀 Android APK Build Successful!

          | Item | Details |
          |---|---|
          | **📱 APK File** | `${{ steps.find_apk.outputs.apk_name }}` |
          | **📦 Size** | `${{ steps.find_apk.outputs.apk_size }}` |
          | **🔑 SHA256** | `${{ steps.find_apk.outputs.apk_sha256 }}` |
          | **🌿 Branch** | `${{ github.ref_name }}` |
          | **🎯 Commit** | `${{ github.sha }}` |

          ### 📲 কিভাবে APK ইনস্টল করবেন:
          1. GitHub Actions রান পেজের নিচে **Artifacts** সেকশনে যান।
          2. **`DriverLoader-APK`** ডাউনলোড করুন।
          3. জিপ ফাইল আনজিপ করে আপনার অ্যান্ড্রয়েড ফোনে `.apk` ফাইলটি ইনস্টল করুন।
          EOF

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriverLoader-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (On Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
          name: "Release ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
